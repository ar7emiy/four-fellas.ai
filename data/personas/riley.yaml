name: riley
niche: golf_lifestyle
status: mvp_testing
reference_image: riley/reference.jpeg

face:
  base_prompt: >-
    Portrait of a 26-year-old athletic American woman, dark blonde
    shoulder-length straight hair, green eyes, light freckles, lightly tanned
    skin, strong jawline, clean and polished appearance, photorealistic,
    natural lighting, 8k
  negative_prompt: >-
    cartoon, anime, illustration, painting, drawing, unrealistic, deformed,
    blurry, ugly, duplicate, watermark, text
  candidate_count: 20
  aspect_ratio: "9:16"
  ccdb_prompts:
    - "subject facing the camera directly, front view."
    - "subject seen from behind, back view."
    - "subject seen from the left side, profile view."
    - "subject seen from the right side, profile view."
    - "close-up of subject's face, front view."
    - "Make this person walk along a golf course fairway at golden hour, athletic wear, sun behind them, 35mm lens at f/2.8."
    - "Make this person swing a golf club mid-follow-through, athletic polo and shorts, dynamic low angle, 85mm lens at f/2.0."
    - "Make this person sit in a golf cart laughing, sunglasses on, casual polo, shot from the side, 50mm lens at f/2.2."
    - "Make this person crouch to read a putt on a green, intense focus, 85mm lens at f/1.8, late afternoon light."
    - "Make this person hold a golf club over their shoulder walking toward the camera, confident smile, 35mm lens at f/2.8."
    - "Make this person at a 19th hole bar, casual sundress, cocktail in hand, warm indoor lighting, 50mm lens at f/1.8."
    - "Make this person stretching before a round on a driving range, athletic wear, morning light, 35mm lens at f/4.0."
    - "Make this person looking out over a scenic golf course from a hilltop, wind in hair, 85mm lens at f/2.0."
    - "Make this person laugh with friends on a golf course, relaxed group setting, candid style, 35mm lens at f/2.8."
    - "Make this person at a luxury resort pool in a swimsuit, sun-kissed skin, relaxed pose, 50mm lens at f/2.0."

pulid:
  reference_strength: 0.8

voice:
  design_prompt: >-
    A 26-year-old American woman. Warm, clear mid-range voice. Slight athletic
    energy — confident but approachable. Not a broadcaster voice. Sounds like
    she's talking to a friend at the 19th hole.
  voice_id: null

tone: "Warm, confident, slightly witty. Self-deprecating about golf game, proud of style."
