name: riley
niche: golf_lifestyle
status: mvp_testing
reference_image: riley/reference.jpeg

face:
  base_prompt: >-
    Portrait of a 26-year-old athletic American woman, dark blonde
    shoulder-length straight hair, green eyes, light freckles, lightly tanned
    skin, strong jawline, clean and polished appearance, photorealistic,
    natural lighting, 8k
  negative_prompt: >-
    cartoon, anime, illustration, painting, drawing, unrealistic, deformed,
    blurry, ugly, duplicate, watermark, text
  candidate_count: 20
  aspect_ratio: "9:16"
  # Phase 0 dataset prompts — teach the LoRA Riley's face identity, not a lifestyle.
  # Diverse poses, angles, lighting, casual outfits. No activity-specific context.
  # Phase 1 inference adds the golf/lifestyle prompts on top of the trained LoRA.
  ccdb_prompts:
    - "subject facing the camera directly, neutral expression, soft natural light, front view."
    - "subject seen from the left side, profile view, outdoor daylight."
    - "subject seen from the right side, profile view, outdoor daylight."
    - "close-up of subject's face, slight smile, front view, sharp focus on eyes."
    - "subject looking slightly off-camera, candid expression, 85mm lens at f/1.8."
    - "Make this person stand in soft window light indoors, casual white t-shirt, relaxed posture, 50mm lens at f/2.0."
    - "Make this person sit at a cafe table, casual outfit, natural expression, 50mm lens at f/2.2."
    - "Make this person walk toward the camera on a city street, casual jeans and top, bright daylight, 35mm lens at f/2.8."
    - "Make this person laugh naturally, head tilted slightly, outdoor setting, 85mm lens at f/1.8."
    - "Make this person look over their shoulder at the camera, half-turn pose, outdoor golden hour light, 85mm lens at f/2.0."
    - "Make this person sit on steps outside, relaxed casual outfit, looking directly at camera, 35mm lens at f/2.8."
    - "Make this person stand in shade on a sunny day, dappled light on face, simple outfit, 50mm lens at f/2.5."
    - "Make this person with wet hair after a shower, minimal makeup, natural skin, close crop, 85mm lens at f/1.4."
    - "Make this person at a rooftop at dusk, city lights behind, casual dress, 50mm lens at f/1.8."
    - "Make this person lying in grass in a park, looking up at camera from below, casual outfit, 35mm lens at f/2.8."

pulid:
  reference_strength: 0.8

voice:
  design_prompt: >-
    A 26-year-old American woman. Warm, clear mid-range voice. Slight athletic
    energy — confident but approachable. Not a broadcaster voice. Sounds like
    she's talking to a friend at the 19th hole.
  voice_id: null

tone: "Warm, confident, slightly witty. Self-deprecating about golf game, proud of style."
